spring:
  application:
    name: styleme-backend-test
  datasource:
    url: jdbc:h2:mem:styleme_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: http://localhost:3000
  jwt:
    secret: test-secret-key-styleme-testing-purpose-only-256-bits-length!
    expiration-ms: 3600000
