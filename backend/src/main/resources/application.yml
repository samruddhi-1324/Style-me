server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: styleme-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/styleme}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://style-me-virid.vercel.app}
  jwt:
    secret: ${JWT_SECRET:default-insecure-dev-secret-key-styleme-phase1-minimum-256-bits-length!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

styleme:
  pricing:
    # GST tax rate applied on discounted subtotal (default 18%)
    tax-rate: ${PRICING_TAX_RATE:0.18}
    # Flat shipping charge when below free-shipping threshold
    shipping-charge: ${PRICING_SHIPPING_CHARGE:99.00}
    # Subtotals >= this amount qualify for free shipping
    free-shipping-threshold: ${PRICING_FREE_SHIPPING_THRESHOLD:999.00}
