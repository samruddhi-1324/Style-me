spring:
  datasource:
    url: jdbc:h2:mem:styleme_local;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        globally_quoted_identifiers: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      data-locations: classpath:local-data.sql
  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: http://localhost:3000
  jwt:
    secret: local-dev-secret-key-styleme-256-bits-length-required!
    expiration-ms: 3600000
