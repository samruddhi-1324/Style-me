server:
  port: ${PORT:8080}
  forward-headers-strategy: native
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never

spring:
  application:
    name: styleme-backend
  datasource:
    url: ${SUPABASE_DATABASE_URL}
    username: ${SUPABASE_DATABASE_USERNAME}
    password: ${SUPABASE_DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: styleme-prod-pool
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    connect-retries: 5
    connect-retries-interval: 5s
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Google

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  frontend-url: ${FRONTEND_URL}
  oauth2:
    google:
      enabled: ${GOOGLE_OAUTH_ENABLED:false}
  auth-cookie:
    name: STYLEME_SESSION
    secure: true
    same-site: None
  security:
    csrf-enabled: ${CSRF_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

styleme:
  pricing:
    tax-rate: ${PRICING_TAX_RATE:0.18}
    shipping-charge: ${PRICING_SHIPPING_CHARGE:99.00}
    free-shipping-threshold: ${PRICING_FREE_SHIPPING_THRESHOLD:999.00}

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate: WARN
    com.styleme: INFO
  file:
    name: ${LOG_FILE_PATH:/tmp/styleme/styleme-backend.log}
